server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle assets separately
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|glb|gltf)$ {
        expires 30d;
        add_header Cache-Control "public, no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
}
