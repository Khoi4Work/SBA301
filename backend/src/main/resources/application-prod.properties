spring.config.activate.on-profile=prod

spring.docker.compose.enabled=false
# Data Source Configuration
spring.datasource.url=${DB_URL_PROD}
spring.datasource.username=${DB_USERNAME_PROD}
spring.datasource.password=${DB_PASSWORD_PROD}
spring.datasource.driverClassName=${DB_DRIVER_PROD}
spring.jpa.database-platform=${DB_PLATFORM_PROD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.show-sql=${SHOW_SQL}

# Application Settings
spring.application.name=philosophy-rag-prod

# Vector Store Configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.codec.max-in-memory-size=16777216
# Google AI Studio Configuration
# ── LLM Provider Configuration ─────────────────────────────────────────────
# Active chat provider: gemini (default) | ollama
app.llm.provider=${LLM_PROVIDER:gemini}

# Ollama settings — only used when app.llm.provider=ollama
app.llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.llm.ollama.model=${OLLAMA_CHAT_MODEL:${OLLAMA_MODEL:llama3.2}}
app.llm.ollama.timeout=${OLLAMA_TIMEOUT:PT120S}
app.llm.ollama.temperature=${OLLAMA_TEMPERATURE:0.7}

# Legacy key (kept for reference, no longer drives provider selection)
# ai.provider=google
voice.provider=${VOICE_PROVIDER:edge}
spring.ai.google.genai.api-key=${GOOGLE_AI_STUDIO_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:${MODEL_CHAT:gemini-2.5-flash}}
spring.ai.google.genai.embedding.api-key=${GOOGLE_AI_STUDIO_API_KEY}
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:${MODEL_EMBEDDING:gemini-embedding-001}}
spring.ai.google.genai.embedding.text.options.dimensions=768

# Google AI Studio Chat Model temperature
spring.ai.google.genai.chat.options.temperature=${GOOGLE_CHAT_TEMPERATURE:0.7}

# ElevenLabs Configuration
elevenlabs.api-key=${ELEVENLABS_API_KEY}
elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:Rachel}

# Cohere Configuration
cohere.api.key=${COHERE_API_KEY}
cohere.rerank.model=rerank-multilingual-v3.0
cohere.top.k=${COHERE_TOP_K:10}
cohere.max.candidates=${COHERE_MAX_CANDIDATES:100}
cohere.max.document.chars=${COHERE_MAX_DOCUMENT_CHARS:4000}


# Logging & Error Handling
logging.level.org.apache.pdfbox.pdmodel.font.FileSystemFontProvider=ERROR

# JWT Secret Configuration
jwt.secret=${JWT_SECRET_KEY}

#AWS S3 Configuration
aws.region=ap-southeast-1
aws.s3.bucket-name=philosophy-learning-materials
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.presigned-url-expiration-minutes=15

#Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL}

# Mail Configuration
spring.mail.host=${MAIL_HOST_PROD:smtp.gmail.com}
spring.mail.port=${MAIL_PORT_PROD:587}
spring.mail.username=${MAIL_USERNAME_PROD}
spring.mail.password=${MAIL_PASSWORD_PROD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Password Reset Configuration
app.frontend-url=${FRONTEND_URL_PROD:http://localhost:5173}
app.password-reset.token-minutes=${PASSWORD_RESET_TOKEN_MINUTES_PROD:15}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/philosophy_rag}
spring.data.mongodb.auto-index-creation=true

