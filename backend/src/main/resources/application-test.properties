spring.config.activate.on-profile=test
spring.docker.compose.enabled=false
# Data Source Configuration

# Database connection settings
spring.datasource.url=jdbc:postgresql://localhost:5432/philoverse
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# (Optional) Config JPA / Hibernate if using ORM
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Application Settings
spring.application.name=philosophy-rag-dev

# Vector Store Configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.codec.max-in-memory-size=16777216

# ── LLM Provider Configuration ─────────────────────────────────────────────
# Active chat provider: gemini (default) | ollama
app.llm.provider=${LLM_PROVIDER:gemini}

# Ollama settings — only used when app.llm.provider=ollama
app.llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.llm.ollama.model=${OLLAMA_CHAT_MODEL:${OLLAMA_MODEL:llama3.2}}
app.llm.ollama.timeout=${OLLAMA_TIMEOUT:PT120S}
app.llm.ollama.temperature=${OLLAMA_TEMPERATURE:0.7}

# Legacy key (kept for reference, no longer drives provider selection)
# ai.provider=google
voice.provider=${VOICE_PROVIDER:edge}
voice.provider.chat=${VOICE_PROVIDER_CHAT:elevenlabs}
voice.provider.lesson=${VOICE_PROVIDER_LESSON:edge}

# Google AI Studio Configuration
spring.ai.google.genai.api-key=${GOOGLE_AI_STUDIO_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:${MODEL_CHAT:gemini-2.5-flash}}
spring.ai.google.genai.embedding.api-key=${GOOGLE_AI_STUDIO_API_KEY}
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:${MODEL_EMBEDDING:gemini-embedding-001}}
spring.ai.google.genai.embedding.text.options.dimensions=768

# Google AI Studio Chat Model temperature
spring.ai.google.genai.chat.options.temperature=${GOOGLE_CHAT_TEMPERATURE:0.7}

# ElevenLabs Configuration
elevenlabs.api-key=${ELEVENLABS_API_KEY}
elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:Rachel}

# Cohere Configuration
cohere.api.key=${COHERE_API_KEY}
cohere.rerank.model=rerank-multilingual-v3.0
cohere.top.k=${COHERE_TOP_K:10}
cohere.max.candidates=${COHERE_MAX_CANDIDATES:100}
cohere.max.document.chars=${COHERE_MAX_DOCUMENT_CHARS:4000}


# Logging & Error Handling
logging.level.org.apache.pdfbox.pdmodel.font.FileSystemFontProvider=ERROR

# Data Initialization
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data/initial_philosophers.sql

# JWT Secret Configuration
jwt.secret=${JWT_SECRET_KEY}

#AWS S3 Configuration
aws.region=ap-southeast-1
aws.s3.bucket-name=philosophy-learning-materials
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.presigned-url-expiration-minutes=15

#Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL}

# Mail Configuration
spring.mail.host=${MAIL_HOST_DEV:smtp.gmail.com}
spring.mail.port=${MAIL_PORT_DEV:587}
spring.mail.username=${MAIL_USERNAME_DEV}
spring.mail.password=${MAIL_PASSWORD_DEV}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Password Reset Configuration
app.frontend-url=${FRONTEND_URL_DEV:http://localhost:5173}
app.password-reset.token-minutes=${PASSWORD_RESET_TOKEN_MINUTES_DEV:15}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/philosophy_rag}
spring.data.mongodb.auto-index-creation=true
